name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src.configs.schema_alignment_config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90
        # NOTE: coverage is scoped to the components that currently have a
        # test suite (Schema Alignment). As Data Ingestion, Data
        # Validation, etc. get their own tests/test_*.py files, add their
        # modules to --cov here (or switch to --cov=src once every
        # component has tests) so the 90% gate applies pipeline-wide.

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
