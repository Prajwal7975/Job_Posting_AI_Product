services:
  # ========================================================
  # MLflow
  # ========================================================

  mlflow-server:
    build:
      context: .
      dockerfile: mlflow.Dockerfile

    container_name: mlflow-server

    ports:
      - "5000:5000"

    volumes:
      - ./mlflow-data:/mlflow

    networks:
      - mlops-network

    restart: unless-stopped

    # MLflow's tracking server exposes a built-in GET /health route
    # (200/"OK") -- used here purely to gate salary-api's startup so it
    # never attempts to load the model before MLflow can actually accept
    # requests. python3 is already present in this image (installed via
    # `pip install mlflow` on a python:3.12-slim-bookworm base), so this
    # adds no new package.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ========================================================
  # FastAPI
  # ========================================================

  salary-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: salary-api

    ports:
      - "8000:8000"

    environment:
      APP_ENV: production
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      SALARY_REGISTERED_MODEL_NAME: salary_prediction_model
      SALARY_MODEL_ALIAS: production
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_RELOAD: "false"
      # Frontend's exposed host port -- see the frontend service below.
      # Not strictly required for the Nginx-proxied path (the browser
      # only ever calls same-origin http://localhost:3000/api/...), but
      # made explicit here rather than relying on the config's
      # local-development CORS fallback now that APP_ENV=production.
      CORS_ALLOWED_ORIGINS: http://localhost:3000

    depends_on:
      mlflow-server:
        condition: service_healthy

    networks:
      - mlops-network

    restart: unless-stopped

    # /readiness always returns HTTP 200 -- it differentiates ready vs.
    # not-ready only via the JSON body's "status" field (by design: see
    # salary_api.py). A bare HTTP-success healthcheck would therefore
    # report "healthy" even with no model loaded, so this parses the
    # body instead of just checking the status code. This does NOT
    # change /health or /readiness themselves -- only how this
    # container's own healthcheck script interprets the (unchanged)
    # response.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://localhost:8000/readiness', timeout=3)); sys.exit(0 if d.get('status') == 'ready' else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================
  # Frontend
  # ========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: salary-frontend

    ports:
      - "3000:80"

    depends_on:
      salary-api:
        condition: service_healthy

    networks:
      - mlops-network

    restart: unless-stopped

# ==========================================================
# Docker network
# ==========================================================

networks:
  mlops-network:
    driver: bridge